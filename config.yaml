# ==============================================================================
# TEL YOLO Robot Vision System - Configuration File
# ==============================================================================

# 視訊來源設定 (Video Source)
video:
  # 支援 HTTP MJPEG 串流網址 (例如 "http://192.168.1.100:8080/stream.mjpg")
  # 或是本機攝影機編號 (0, 1, 2)
  source: "http://127.0.0.1:8080/stream.mjpg"
  
  # 當 HTTP 串流無法連線時，是否嘗試 fallback 到本機攝影機
  enable_fallback: true
  fallback_device: 0
  
  # 斷線自動重連間隔 (秒)
  reconnect_delay_sec: 2.0
  
  # 期望讀取解析度 (0 代表使用相機/串流原始解析度)
  frame_width: 0
  frame_height: 0

# 模型與推論設定 (Model & Inference)
model:
  # PyTorch 權重檔案路徑 (Windows w/ NVIDIA GPU 預設使用)
  weights: "runs/detect/train-7/weights/best.pt"
  
  # ONNX 輕量化權重 (樹莓派 RPi 5 或無 CUDA 環境推薦)
  onnx_weights: "best.onnx"
  
  # 推論裝置: "auto", "cuda", "cuda:0", "cpu"
  # "auto" 會自動檢查是否有可用 NVIDIA GPU，若有則優先使用 CUDA
  device: "auto"
  
  # YOLO 置信度門檻 (Confidence Threshold)
  conf_threshold: 0.5
  
  # 靶板剛體標籤類別名稱 (如 "TEL")
  target_class: "TEL"

# 剛體幾何與投影設定 (Rigid Body Geometry)
geometry:
  # 每一排孔洞相對於 TEL 標籤中心與高度 (h) 的向下偏移倍率
  # 3 個標籤 × 4 排 = 12 個孔洞坐標
  row_ratios: [2.0, 6.0, 10.0, 14.0]
  
  # 第一排孔洞取樣區域半徑 (ROI 半徑，像素)
  roi_sample_radius: 14
  
  # 動態圖層遮罩孔洞圓形半徑 (像素)
  dynamic_mask_radius: 20

# 色彩學抗過曝濾波設定 (Anti-Overexposure Color Filter)
color_filter:
  # 低飽和度紅光區段 1 (HSV: H 0-10, S 30-255, V 150-255)
  lower_red1: [0, 30, 150]
  upper_red1: [10, 255, 255]
  
  # 低飽和度紅光區段 2 (HSV: H 170-180, S 30-255, V 150-255)
  lower_red2: [170, 30, 150]
  upper_red2: [180, 255, 255]
  
  # 判定為紅光亮起的有效像素門檻
  min_red_pixel_count: 50

# HTTP 結構化資料回傳設定 (TELBot-Host 介接)
http_sender:
  # 是否啟用主動 HTTP POST 傳送
  enabled: true
  
  # TELBot-Host 接收端點 (若未架設或離線，非同步佇列會自動忽略，不阻塞視覺管道)
  endpoint_url: "http://127.0.0.1:8000/api/vision/target"
  
  # 請求逾時時間 (秒)
  timeout: 0.3
  
  # 最大發送頻率 (Hz)
  max_fps: 20

# 系統與介面顯示設定 (System & Display)
system:
  # 是否以無介面模式 (Headless Mode) 運行 (RPi 5 預設請設為 true)
  headless: false
  
  # 視窗標題名稱
  hud_window_name: "TEL Robot - Vision HUD"
  debug_window_name: "TEL Robot - HSV Mask Debug"

